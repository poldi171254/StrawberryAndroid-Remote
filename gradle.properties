# Project-wide Gradle settings.

# JVM memory for Gradle daemon - bump to 4g if you have RAM to spare
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Faster builds on multi-core machines - safe to enable for a single-module project
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# R class optimisation - keeps R class lean
android.nonTransitiveRClass=true

# Suppresses the excludeLibraryComponentsFromConstraints performance warning
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
